<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeRailAI - Live Camera</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .header {
            background: #0D47A1;
            padding: 18px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .status {
            background: #16803c;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .camera-box {
            margin: 25px auto;
            width: 90%;
            max-width: 1000px;
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
        }

        .camera-box img {
            width: 100%;
            max-width: 960px;
            height: auto;
            border: 4px solid white;
            border-radius: 10px;
            display: block;
            margin: auto;
        }

        .info {
            margin: 15px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            background: #1976D2;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            margin: 8px;
            border-radius: 8px;
            font-size: 17px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #0D47A1;
        }

        .report-btn {
            background: #555;
        }

        .report-btn:hover {
            background: #333;
        }

    </style>
</head>

<body>

    <div class="header">
        <h1>🚆 SafeRailAI Live Monitoring</h1>
    </div>

    <div class="status">
        🟢 AI Monitoring Active
    </div>

    <div class="camera-box">

        <img
            src="{{ url_for('video_feed') }}"
            alt="Live AI Camera Feed"
        >

    </div>

    <div class="info">
        🤖 YOLO AI Detection &nbsp; | &nbsp;
        📷 Live Camera &nbsp; | &nbsp;
        🚨 Automatic Alert
    </div>

    <a href="/report" class="btn report-btn">
        📋 View Reports
    </a>

    <a href="/dashboard" class="btn">
        ⬅ Back to Dashboard
    </a>

</body>

</html>
