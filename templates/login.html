<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeRailAI - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #003b73, #1976d2);
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-wrapper {
            width: 92%;
            max-width: 430px;
        }

        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        .logo {
            font-size: 55px;
        }

        h1 {
            margin: 5px 0;
            color: #003b73;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25,118,210,0.12);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #1976d2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0d47a1;
        }

        .register-link {
            margin-top: 22px;
            color: #555;
        }

        .register-link a {
            color: #1976d2;
            font-weight: bold;
            text-decoration: none;
        }

        .back-btn {
            display: inline-block;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
        }

        .back-btn:hover {
            color: #1976d2;
        }

        .security {
            margin-top: 20px;
            padding: 11px;
            background: #f1f8ff;
            border-radius: 8px;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">🚆</div>

        <h1>SafeRailAI</h1>

        <p class="subtitle">
            AI-Powered Railway Safety Monitoring
        </p>

        <h2>🔐 User Login</h2>

        {% if error %}
        <div class="error-message">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username">

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password">

            </div>

            <button
                type="submit"
                class="login-btn">
                🔓 Login
            </button>

        </form>

        <div class="register-link">
            New user?
            <a href="{{ url_for('register') }}">
                Create an account
            </a>
        </div>

        <a href="{{ url_for('home') }}"
           class="back-btn">
            ⬅ Back to Home
        </a>

        <div class="security">
            🛡️ Secure user authentication
        </div>

    </div>

</div>

</body>
</html>
